<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Perpisahan Angkatan 72 - SMK Pembangunan</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1a2a6c;
            --gold: #d4af37;
            --light: #fcfaf7;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--light);
            color: var(--primary);
            overflow-x: hidden;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            background: linear-gradient(rgba(26, 42, 108, 0.7), rgba(26, 42, 108, 0.7)), 
                        url('https://images.unsplash.com/photo-1523050853063-880c6934ce8a?auto=format&fit=crop&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 60px 20px;
        }

        /* Logo Wrapper & Shine */
        .logo-wrapper {
            position: relative;
            width: 140px;
            margin-bottom: 20px;
            display: inline-block;
        }

        .school-logo { width: 100%; height: auto; display: block; position: relative; z-index: 1; }

        .logo-shine {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
            -webkit-mask-image: url('https://lh3.googleusercontent.com/d/1ZFsAzpVeiwex8MGMXlFev-wuQzZc9xPB');
            mask-image: url('https://lh3.googleusercontent.com/d/1ZFsAzpVeiwex8MGMXlFev-wuQzZc9xPB');
            -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
            overflow: hidden;
        }

        .logo-shine::after {
            content: ""; position: absolute; top: 0; left: -150%; width: 100%; height: 100%;
            background: linear-gradient(to right, transparent 0%, rgba(255, 255, 255, 0.6) 50%, transparent 100%);
            transform: skewX(-25deg); animation: shine-effect 4s infinite;
        }

        @keyframes shine-effect { 0% { left: -150%; } 20% { left: 150%; } 100% { left: 150%; } }

        /* Floating Music Control */
        .music-control {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 1000;
            background: var(--gold);
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            border: 3px solid white;
            animation: pulse 2s infinite;
            transition: 0.3s;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .hero h2 { font-family: 'Playfair Display', serif; font-size: 1.1rem; letter-spacing: 3px; color: var(--gold); margin: 0; }
        .hero h1 { font-family: 'Playfair Display', serif; font-size: clamp(2.2rem, 8vw, 3.8rem); margin: 10px 0; line-height: 1.2; }

        section { padding: 60px 20px; text-align: center; }
        .countdown-section { background: white; }
        #timer { display: flex; justify-content: center; gap: 10px; margin-top: 25px; flex-wrap: wrap; }
        .time-box { background: var(--primary); color: white; padding: 15px; border-radius: 12px; min-width: 80px; }
        .time-box span { display: block; font-size: 1.8rem; font-weight: bold; color: var(--gold); }

        .card { background: white; max-width: 850px; margin: 0 auto 40px; padding: 40px 25px; border-radius: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.06); border-top: 10px solid var(--gold); }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; text-align: left; margin-top: 30px; }
        .info-item { padding: 20px; background: #fcfcfc; border: 1px solid #eee; border-left: 4px solid var(--gold); border-radius: 12px; }
        .btn-maps { display: inline-block; margin-top: 35px; padding: 15px 40px; background: var(--primary); color: white; text-decoration: none; border-radius: 50px; font-weight: 600; }
        footer { padding: 50px 20px; background: var(--primary); color: white; text-align: center; }
    </style>
</head>
<body>

    <div style="display:none">
        <div id="player"></div>
    </div>

    <button class="music-control" onclick="togglePlay()" id="musicBtn">
        <span id="musicIcon" style="font-size: 24px;">🎵</span>
    </button>

    <section class="hero">
        <div class="logo-wrapper" data-aos="fade-down">
            <img src="https://lh3.googleusercontent.com/d/1ZFsAzpVeiwex8MGMXlFev-wuQzZc9xPB" alt="Logo SMK Pembangunan" class="school-logo">
            <div class="logo-shine"></div>
        </div>
        
        <div data-aos="fade-down" data-aos-delay="200">
            <h2>PUNCAK APRESIASI & PERPISAHAN</h2>
            <h1>ANGKATAN 72</h1>
            <p>SMK Pembangunan Kota Bogor</p>
        </div>
    </section>

    <section class="countdown-section">
        <h3 data-aos="fade-up">Menuju Hari Pelepasan</h3>
        <div id="timer" data-aos="fade-up">
            <div class="time-box"><span id="days">00</span> Hari</div>
            <div class="time-box"><span id="hours">00</span> Jam</div>
            <div class="time-box"><span id="minutes">00</span> Menit</div>
        </div>
    </section>

    <section class="details">
        <div class="card" data-aos="fade-up">
            <h3>Detail Acara</h3>
            <div class="info-grid">
                <div class="info-item">
                    <h4>📅 Waktu</h4>
                    <p>Rabu, 13 Mei 2026<br>Pukul 07.30 WIB - Selesai</p>
                </div>
                <div class="info-item">
                    <h4>📍 Lokasi</h4>
                    <p>Aula SMK Pembangunan<br>Bogor Timur</p>
                </div>
            </div>
            <a href="https://goo.gl/maps/xyz" target="_blank" class="btn-maps">Lihat Lokasi</a>
        </div>
    </section>

    <footer>
        <p><strong>SMK Pembangunan Kota Bogor</strong><br>Angkatan 72 | 2026</p>
    </footer>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });

        // Timer
        const target = new Date("May 13, 2026 07:30:00").getTime();
        setInterval(function() {
            const now = new Date().getTime();
            const diff = target - now;
            document.getElementById("days").innerHTML = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById("hours").innerHTML = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById("minutes").innerHTML = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        }, 1000);
